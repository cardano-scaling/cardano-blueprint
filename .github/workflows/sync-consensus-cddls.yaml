name: Sync consensus CDDLs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  sync:
    name: Sync from ouroboros-consensus@${{ matrix.branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        branch:
          - main
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Fetch upstream consensus CDDLs
        run: bash .github/scripts/sync-cddls.sh consensus "${{ matrix.branch }}"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ matrix.branch }}
          branch: sync/consensus-cddls-${{ matrix.branch }}
          delete-branch: true
          commit-message: "Sync consensus CDDLs from ouroboros-consensus@${{ matrix.branch }}"
          title: "Sync consensus CDDLs from ouroboros-consensus@${{ matrix.branch }}"
          body: |
            Automated update of the hard-fork combinator CDDLs from
            [`IntersectMBO/ouroboros-consensus@${{ matrix.branch }}`](https://github.com/IntersectMBO/ouroboros-consensus/tree/${{ matrix.branch }}/ouroboros-consensus-cardano/cddl):
            `src/codecs/base.cddl` and the block, header, tx and txid modules
            under `src/network/node-to-node`.
